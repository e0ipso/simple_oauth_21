simple_oauth_device_flow.settings:
  type: config_object
  label: 'Simple OAuth Device Flow settings'
  constraints:
    DeviceCodeGeneration: []
  mapping:
    device_code_lifetime:
      type: integer
      label: 'Device Code Lifetime (seconds)'
      constraints:
        Range:
          min: 1
    polling_interval:
      type: integer
      label: 'Polling Interval (seconds)'
      constraints:
        Range:
          min: 1
    user_code_length:
      type: integer
      label: 'User Code Length'
      constraints:
        Range:
          min: 6
          max: 12
    user_code_charset:
      type: string
      label: 'User Code Character Set'
    verification_uri:
      type: string
      label: 'Device verification form path or alias'
    verification_uri_complete:
      type: boolean
      label: 'Include verification URI complete'
    verification_uri_complete_enabled:
      type: boolean
      label: 'Enable verification URI complete'
    cleanup_retention_days:
      type: integer
      label: 'Cleanup retention days for authorized codes'
      constraints:
        Range:
          min: 1
    max_cleanup_batch_size:
      type: integer
      label: 'Maximum cleanup batch size'
      constraints:
        Range:
          min: 1
    enable_statistics_logging:
      type: boolean
      label: 'Enable statistics logging'
    max_authorization_attempts:
      type: integer
      label: 'Maximum failed verification attempts per user per hour'
      constraints:
        Range:
          min: 1
    user_code_format:
      type: string
      label: 'Legacy user code format pattern'
    user_code_uppercase:
      type: boolean
      label: 'Use uppercase user codes'
    user_code_excluded_chars:
      type: string
      label: 'Characters excluded from generated user codes'
    cleanup_enabled:
      type: boolean
      label: 'Enable automatic cleanup'
    cleanup_interval:
      type: integer
      label: 'Cleanup interval in seconds'
      constraints:
        Range:
          min: 1
