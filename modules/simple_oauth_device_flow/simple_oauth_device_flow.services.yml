services:
  # Device logging omits request metadata that may contain credentials.
  simple_oauth_device_flow.logger_factory:
    class: Drupal\simple_oauth_device_flow\Service\DeviceFlowLoggerChannelFactory
    tags:
      - { name: service_collector, tag: logger, call: addLogger }

  logger.channel.simple_oauth_device_flow:
    parent: logger.channel_base
    factory: ['@simple_oauth_device_flow.logger_factory', 'get']
    arguments: ['simple_oauth_device_flow']

  simple_oauth_device_flow.settings:
    class: Drupal\simple_oauth_device_flow\Service\DeviceFlowSettingsService
    arguments: ['@config.factory', '@path.validator']
    tags:
      - { name: event_subscriber }

  simple_oauth_device_flow.device_code_repository:
    class: Drupal\simple_oauth_device_flow\Repository\DeviceCodeRepository
    arguments:
      [
        '@entity_type.manager',
        '@simple_oauth_device_flow.settings',
        '@simple_oauth_device_flow.logger_factory',
        '@simple_oauth.repositories.client',
        '@lock',
        '@datetime.time',
        '@simple_oauth.oauth2_scope.provider',
      ]

  # Consumers can replace each operation contract independently.
  simple_oauth_device_flow.verification_repository:
    alias: simple_oauth_device_flow.device_code_repository

  simple_oauth_device_flow.user_code_lookup:
    alias: simple_oauth_device_flow.device_code_repository

  simple_oauth_device_flow.lifecycle_repository:
    alias: simple_oauth_device_flow.device_code_repository

  simple_oauth_device_flow.user_code_generator:
    class: Drupal\simple_oauth_device_flow\Service\UserCodeGenerator
    arguments:
      - '@config.factory'
      - '@simple_oauth_device_flow.user_code_lookup'
      - '@simple_oauth_device_flow.logger_factory'

  simple_oauth_device_flow.device_code_service:
    class: Drupal\simple_oauth_device_flow\Service\DeviceCodeService
    arguments:
      - '@simple_oauth_device_flow.lifecycle_repository'
      - '@simple_oauth_device_flow.user_code_generator'
      - '@simple_oauth_device_flow.settings'
      - '@datetime.time'
      - '@simple_oauth_device_flow.logger_factory'
      - '@simple_oauth.repositories.scope'
      - null
      - '@state'
      - '@lock'
      - '@simple_oauth.oauth2_scope.provider'
