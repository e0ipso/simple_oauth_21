bypass token revocation restrictions:
  title: 'Bypass token revocation restrictions'
  description: 'Revoke tokens issued to any client at the token revocation endpoint, not only tokens issued to the requesting client.'
  restrict access: TRUE

bypass token introspection restrictions:
  title: 'Bypass token introspection restrictions'
  description: 'Introspect tokens of any user at the token introspection endpoint, not only your own tokens.'
  restrict access: TRUE
