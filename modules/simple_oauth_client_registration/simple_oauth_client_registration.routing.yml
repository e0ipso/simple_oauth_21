# Clients call these endpoints at fixed URLs. On a multilingual site,
# _disable_route_normalizer keeps the Redirect module from sending them to a
# language-prefixed copy.
simple_oauth_client_registration.register:
  path: '/oauth/register'
  defaults:
    _controller: '\Drupal\simple_oauth_client_registration\Controller\ClientRegistrationController::register'
    _disable_route_normalizer: TRUE
    _title: 'OAuth 2.0 Client Registration'
  methods: [POST]
  requirements:
    # Public endpoint per RFC 7591 - no authentication required
    _access: 'TRUE'
  options:
    _format: 'json'
    no_cache: TRUE

simple_oauth_client_registration.manage:
  path: '/oauth/register/{client_id}'
  defaults:
    _controller: '\Drupal\simple_oauth_client_registration\Controller\ClientRegistrationController::manage'
    _disable_route_normalizer: TRUE
    _title: 'OAuth 2.0 Client Management'
  methods: [GET, POST, PUT, DELETE]
  requirements:
    # Public endpoint - authentication handled in controller
    _access: 'TRUE'
    client_id: '^[a-zA-Z0-9_\-\/\+=]{32,128}$'
  options:
    _format: 'json'
    no_cache: TRUE
    _oauth_skip_auth: TRUE

simple_oauth_client_registration.settings:
  path: '/admin/config/services/simple-oauth/oauth-21/client-registration'
  defaults:
    _form: '\Drupal\simple_oauth_client_registration\Form\ClientRegistrationSettingsForm'
    _title: 'Client Registration Settings'
  requirements:
    _permission: 'administer simple_oauth entities'
